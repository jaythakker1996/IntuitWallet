services:
  app-postgres:
    image: postgres:16-alpine
    container_name: wallet-app-postgres
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-wallet}
    ports:
      - "5433:5432"
    networks:
      - wallet-net
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal-postgres:
    image: postgres:16-alpine
    container_name: wallet-temporal-postgres
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    networks:
      - wallet-net
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.25
    container_name: wallet-temporal
    depends_on:
      - temporal-postgres
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "7233:7233"
    networks:
      - wallet-net

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: wallet-temporal-ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"
    networks:
      - wallet-net

  app:
    build: ../backend
    container_name: wallet-app
    depends_on:
      app-postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-wallet}
    ports:
      - "8081:8081"
    networks:
      - wallet-net

  pgweb:
    image: sosedoff/pgweb:0.16.2
    container_name: wallet-pgweb
    restart: unless-stopped
    depends_on:
      app-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wallet:${APP_DB_PASSWORD:-wallet}@app-postgres:5432/wallet?sslmode=disable
    ports:
      - "8082:8081"
    networks:
      - wallet-net

networks:
  wallet-net:
    name: wallet-net

volumes:
  app-postgres-data:
  temporal-postgres-data:
